name: "Stage 3: Agent review"
# Runs your review-pr skill on every implementation PR, alongside BugBot + CI.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

jobs:
  agent-review:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'stage:implementation') &&
      (github.event.action != 'labeled' || github.event.label.name == 'stage:implementation') &&
      vars.MASSNER_STAGE3 == 'on'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install Cursor CLI
        run: curl https://cursor.com/install -fsS | bash && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run review-pr skill
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cursor-agent -p "Use the review-pr skill on PR #${{ github.event.pull_request.number }} in ${{ github.repository }}. Post your structured review as a PR comment using gh. Do not push commits." \
            --force --output-format text
